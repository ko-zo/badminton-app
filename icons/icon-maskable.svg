<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- マスカブル用: 全面背景。円形マスク(半径40%)でも欠けない大きさにしている -->
  <rect width="512" height="512" fill="#2E7D32"/>
  <g transform="translate(256 256) scale(0.86) translate(-256 -291)">
    <g stroke="#1A1A1A" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- 顔（耳のとがりは stroke-linejoin="round" でわずかに丸くなる） -->
      <path fill="#FFFFFF" stroke-width="15" d="
        M 128 250
        L 140 120
        L 232 184
        C 250 176 262 176 280 184
        L 372 120
        L 384 250
        C 402 284 404 330 388 372
        C 362 432 312 462 256 462
        C 200 462 150 432 124 372
        C 108 330 110 284 128 250
        Z"/>
  
      <!-- 左目：¥（青） -->
      <g stroke="#1565C0" stroke-width="14">
        <path d="M 169 256 L 196 282"/>
        <path d="M 223 256 L 196 282"/>
        <path d="M 196 282 L 196 318"/>
        <path d="M 176 294 L 216 294"/>
        <path d="M 176 308 L 216 308"/>
      </g>
  
      <!-- 右目：¥（ピンク）＝オッドアイ -->
      <g stroke="#D81B60" stroke-width="14">
        <path d="M 289 256 L 316 282"/>
        <path d="M 343 256 L 316 282"/>
        <path d="M 316 282 L 316 318"/>
        <path d="M 296 294 L 336 294"/>
        <path d="M 296 308 L 336 308"/>
      </g>
  
      <!-- 鼻 -->
      <path fill="#1A1A1A" stroke-width="7" d="
        M 240 342 Q 256 334 272 342 Q 264 362 256 362 Q 248 362 240 342 Z"/>
  
      <!-- 口（ω） -->
      <path stroke-width="12" d="M 256 364 Q 238 398 213 383"/>
      <path stroke-width="12" d="M 256 364 Q 274 398 299 383"/>
    </g>
  </g>
</svg>
